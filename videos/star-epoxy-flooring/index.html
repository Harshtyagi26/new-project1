<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #151515;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="39"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hero"
        class="scene"
        data-composition-id="01-hero"
        data-composition-src="compositions/frames/01-hero.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-problem"
        class="scene"
        data-composition-id="02-problem"
        data-composition-src="compositions/frames/02-problem.html"
        data-start="5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-stat"
        class="scene"
        data-composition-id="03-stat"
        data-composition-src="compositions/frames/03-stat.html"
        data-start="10"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-benefits"
        class="scene"
        data-composition-id="04-benefits"
        data-composition-src="compositions/frames/04-benefits.html"
        data-start="15"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-specs"
        class="scene"
        data-composition-id="05-specs"
        data-composition-src="compositions/frames/05-specs.html"
        data-start="22"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-apply"
        class="scene"
        data-composition-id="06-apply"
        data-composition-src="compositions/frames/06-apply.html"
        data-start="27"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-endcard"
        class="scene"
        data-composition-id="07-endcard"
        data-composition-src="compositions/frames/07-endcard.html"
        data-start="33"
        data-duration="6"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hero", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-problem", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.to("#el-02-problem", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-stat", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.to("#el-03-stat", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.fromTo("#el-04-benefits", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.to("#el-04-benefits", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.fromTo("#el-05-specs", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.to("#el-05-specs", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.fromTo("#el-06-apply", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.to("#el-06-apply", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 33);
        tl.fromTo("#el-07-endcard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 33);
        tl.to({}, { duration: 39 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
